name: coach_fitness_app
description: A Flutter project for CoachFitness.
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Use a modern SDK range

dependencies:
  http: ^1.1.0
  flutter:
    sdk: flutter

  # For the progress screen calendar
  table_calendar: ^3.1.1 # Updated to latest

  # --- FIREBASE PACKAGES (UPDATED TO LATEST) ---
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0 # ⭐️ ADDED for file uploads

  # --- UTILITY PACKAGES ---
  image_picker: ^1.1.2 # ⭐️ ADDED for picking videos/images
  video_player: ^2.8.6 # ⭐️ ADDED for playing videos
  shared_preferences: ^2.2.2 # ⭐️ ADDED for session persistence
  lottie: ^3.1.0 # ⭐️ ADDED for Lottie animations

  # For iOS style icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/animations/